<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salon Catalog</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body class="catalog-page">

  <header class="navbar">
    <div class="logo">Hair Salon</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="booking.html">Booking</a>
      <a href="#">Login</a>
    </nav>
  </header>

  <section class="catalog-header">
    <h1>Salon Catalog</h1>

    <p>
      Browse available salons, compare ratings, and find the best salon near you.
    </p>
  </section>

  <!-- Search + Filter -->
  <section class="search-section">

    <input
      type="text"
      id="searchBar"
      placeholder="Search salon..."
    >

    <select id="filterSelect">
      <option value="all">All Suburbs</option>
      <option value="Melbourne CBD">Melbourne CBD</option>
      <option value="Box Hill">Box Hill</option>
      <option value="Richmond">Richmond</option>
    </select>

  </section>

  <!-- Salon Cards -->
  <section class="catalog-section">

    <div class="catalog-container" id="salonContainer">

      <!-- Salon 1 -->
      <div class="catalog-card" data-name="Elite Hair Studio" data-location="Melbourne CBD">

        <img src="images/salon1.png" alt="Salon">

        <div class="catalog-content">

          <h3>Elite Hair Studio</h3>

          <p>Melbourne CBD</p>

          <p class="rating">⭐ 4.8 Rating</p>

          <button class="btn-primary">
            View Salon
          </button>

        </div>
      </div>

      <!-- Salon 2 -->
      <div class="catalog-card" data-name="Modern Cuts" data-location="Box Hill">

        <img src="images/salon2.png" alt="Salon">

        <div class="catalog-content">

          <h3>Modern Cuts</h3>

          <p>Box Hill</p>

          <p class="rating">⭐ 4.6 Rating</p>

          <button class="btn-primary">
            View Salon
          </button>

        </div>
      </div>

      <!-- Salon 3 -->
      <div class="catalog-card" data-name="Luxury Salon" data-location="Richmond">

        <img src="images/salon3.png" alt="Salon">

        <div class="catalog-content">

          <h3>Luxury Salon</h3>

          <p>Richmond</p>

          <p class="rating">⭐ 4.9 Rating</p>

          <button class="btn-primary">
            View Salon
          </button>

        </div>
      </div>

    </div>
  </section>

  <footer>
    <p>&copy; 2026 Hair Salon Appointment Booking System</p>
  </footer>

  <!-- Simple Search + Filter -->
  <script>

    const searchBar = document.getElementById("searchBar");
    const filterSelect = document.getElementById("filterSelect");
    const cards = document.querySelectorAll(".catalog-card");

    function filterSalons() {

      const searchValue = searchBar.value.toLowerCase();
      const filterValue = filterSelect.value;

      cards.forEach(card => {

        const name = card.dataset.name.toLowerCase();
        const location = card.dataset.location;

        const matchesSearch = name.includes(searchValue);

        const matchesFilter =
          filterValue === "all" || location === filterValue;

        if (matchesSearch && matchesFilter) {
          card.style.display = "block";
        } else {
          card.style.display = "none";
        }

      });

    }

    searchBar.addEventListener("input", filterSalons);

    filterSelect.addEventListener("change", filterSalons);

  </script>

</body>
</html>

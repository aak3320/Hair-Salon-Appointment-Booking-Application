<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salon Catalog</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body class="catalog-page">

  <header class="navbar">
    <div class="logo">Hair Salon</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="booking.html">Booking</a>
      <a href="#">Login</a>
    </nav>
  </header>

  <section class="catalog-header">
    <h1>Salon Catalog</h1>

    <p>
      Browse available salons, compare ratings, and find the best salon near you.
    </p>
  </section>

  <!-- Search + Filter -->
  <section class="search-section">

    <input
      type="text"
      id="searchBar"
      placeholder="Search salon..."
    >

    <select id="filterSelect">
      <option value="all">All Suburbs</option>
    </select>

  </section>

  <!-- Salon Cards -->
  <section class="catalog-section">

    <div class="catalog-container" id="salonContainer">

      <!-- Salon 1 -->
      <div class="catalog-card" data-name="Elite Hair Studio" data-location="Melbourne CBD">

        <img src="images/salon1.png" alt="Salon">

        <div class="catalog-content">

          <h3>Elite Hair Studio</h3>

          <p>Melbourne CBD</p>

          <p class="rating">⭐ 4.8 Rating</p>

          <button class="btn-primary">
            View Salon
          </button>

        </div>
      </div>

      <!-- Salon 2 -->
      <div class="catalog-card" data-name="Modern Cuts" data-location="Box Hill">

        <img src="images/salon2.png" alt="Salon">

        <div class="catalog-content">

          <h3>Modern Cuts</h3>

          <p>Box Hill</p>

          <p class="rating">⭐ 4.6 Rating</p>

          <button class="btn-primary">
            View Salon
          </button>

        </div>
      </div>

      <!-- Salon 3 -->
      <div class="catalog-card" data-name="Luxury Salon" data-location="Richmond">

        <img src="images/salon3.png" alt="Salon">

        <div class="catalog-content">

          <h3>Luxury Salon</h3>

          <p>Richmond</p>

          <p class="rating">⭐ 4.9 Rating</p>

          <button class="btn-primary">
            View Salon
          </button>

        </div>
      </div>

    </div>
  </section>

  <footer>
    <p>&copy; 2026 Hair Salon Appointment Booking System</p>
  </footer>

  <!-- Simple Search + Filter -->
 <script>
  const searchBar = document.getElementById("searchBar");
  const filterSelect = document.getElementById("filterSelect");
  const salonContainer = document.getElementById("salonContainer");

  const melbourneSuburbs = [
    "Melbourne CBD", "Clayton", "Burwood", "Box Hill", "Richmond",
    "Dandenong", "Springvale", "Glen Waverley", "Mount Waverley",
    "Chadstone", "Oakleigh", "Caulfield", "St Kilda", "South Yarra",
    "Prahran", "Carlton", "Brunswick", "Footscray", "Sunshine",
    "Preston", "Coburg", "Hawthorn", "Doncaster", "Ringwood",
    "Frankston", "Noble Park", "Malvern", "Toorak", "Brighton"
  ];

  function loadSuburbs() {
    melbourneSuburbs.forEach((suburb) => {
      const option = document.createElement("option");
      option.value = suburb;
      option.textContent = suburb;
      filterSelect.appendChild(option);
    });
  }

  async function loadSalons(suburb) {
    if (!suburb || suburb.trim() === "") {
      salonContainer.innerHTML = "<p>Please select or search a suburb.</p>";
      return;
    }

    try {
      salonContainer.innerHTML = "<p>Loading salons...</p>";

      const response = await fetch(`/salons?suburb=${encodeURIComponent(suburb)}`);
      const salons = await response.json();

      displaySalons(salons, suburb);
    } catch (error) {
      console.log("Error loading salons:", error);
      salonContainer.innerHTML = "<p>Unable to load salons.</p>";
    }
  }

  function displaySalons(salons, suburb) {
    salonContainer.innerHTML = "";

    if (!salons || salons.length === 0) {
      salonContainer.innerHTML = `<p>No salons found for ${suburb}.</p>`;
      return;
    }

    salons.forEach((salon) => {
      const card = document.createElement("div");
      card.className = "catalog-card";

      card.innerHTML = `
        <img src="${salon.photos && salon.photos[0] ? salon.photos[0] : 'images/salon1.png'}" alt="Salon">

        <div class="catalog-content">
          <h3>${salon.name}</h3>
          <p>${salon.address || suburb}</p>
          <p class="rating">⭐ ${salon.ratings || "N/A"} Rating</p>
          <a href="${salon.url || '#'}" target="_blank">
            <button class="btn-primary">View Salon</button>
          </a>
        </div>
      `;

      salonContainer.appendChild(card);
    });
  }

  filterSelect.addEventListener("change", function () {
    searchBar.value = "";
    loadSalons(filterSelect.value);
  });

  searchBar.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      filterSelect.value = "";
      loadSalons(searchBar.value.trim());
    }
  });

  loadSuburbs();
  loadSalons("Melbourne CBD");
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking</title>
  <!-- Materialize CSS-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="booking-page">

  <!-- Common Navigation bar-->
  <nav class="navbar-custom">
    <div class="nav-wrapper container">

      <!-- Logo -->
      <a href="index.html" class="brand-logo">Hair Salon</a>

      <!-- Mobile Menu Icon -->
      <a href="#" data-target="mobile-menu" class="sidenav-trigger">
        <i class="material-icons">menu</i>
      </a>

      <!-- Deskstop Navigation Links -->
      <ul class="right hide-on-med-and-down">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="booking.html" class="nav-active">Booking</a></li>
        <li><a href="login.html" id="navLoginLink">Login</a></li>
        <li><a href="#" id="navUserName"></a></li>
      </ul>

      <!-- Mobile Side Navigation -->
      <ul class="sidenav" id="mobile-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="booking.html">Booking</a></li>
        <li><a href="login.html" id="navLoginLinkMobile">Login</a></li>
        <li><a href="#" id="navUserNameMobile"></a></li>
      </ul>
    </div>
  </nav>

  <section class="booking-section">
    <h1>Book an Appointment</h1>
    <p>Please fill in the form below to book your salon appointment.</p>

    <form class="booking-form">
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>

      <select required>
        <option value="">Select Salon</option>
        <option>Elite Hair Studio</option>
        <option>Modern Cuts</option>
        <option>Luxury Salon</option>
      </select>

      <input type="date" required>
      <input type="time" required>

      <textarea placeholder="Additional notes"></textarea>

      <button class="btn-primary" type="submit">Confirm Booking</button>
    </form>
  </section>

  <!-- ── Footer ── -->
  <footer class="page-footer footer-custom">
    <div class="footer-copyright">
      <div class="container center-align">
        &copy; 2026 Hair Salon Appointment Booking System
      </div>
    </div>
  </footer>

  <!-- Materialize JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

  <!-- Auth JS: Authentication JS file to handle login and registration logic for Frontend -->
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      M.Sidenav.init(document.querySelectorAll('.sidenav'));
    });
  </script>

</body>

</html>
